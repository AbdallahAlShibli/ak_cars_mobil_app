<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AK Cars app icon — "Sand & Ink".
       Ink tile + cream car face + amber light bar (offers/service accent).
       Full bleed: the platform mask supplies the corner radius. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26241F"/>
      <stop offset="1" stop-color="#16150F"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A23B"/>
      <stop offset="1" stop-color="#B07818"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ink)"/>

  <g transform="translate(512,516) scale(1.1) translate(-512,-506)">
    <!-- cabin -->
    <path fill="#F6F3EE" d="M414 292 L610 292 C656 292 686 316 700 360 L742 456 L282 456 L324 360 C338 316 368 292 414 292 Z"/>
    <!-- windshield -->
    <path fill="#16150F" d="M436 346 L588 346 C610 346 622 356 628 374 L648 430 L376 430 L396 374 C402 356 414 346 436 346 Z"/>
    <!-- body with fender shoulders -->
    <path fill="#F6F3EE" d="M252 446 L772 446 C796 446 812 466 810 490 L796 606 C792 640 768 660 736 660 L288 660 C256 660 232 640 228 606 L214 490 C212 466 228 446 252 446 Z"/>
    <!-- light bar -->
    <rect x="286" y="520" width="452" height="44" rx="22" fill="url(#amber)"/>
    <!-- tyres -->
    <rect x="278" y="658" width="142" height="56" rx="28" fill="#F6F3EE"/>
    <rect x="604" y="658" width="142" height="56" rx="28" fill="#F6F3EE"/>
  </g>
</svg>
