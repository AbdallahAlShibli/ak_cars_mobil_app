name: ak_cars_mobil_app
description: "AK Cars — car services, parts, and cars marketplace for Oman."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.0.5
  shared_preferences: ^2.3.3
  collection: ^1.19.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  google_fonts: ^6.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image_picker_platform_interface: ^2.11.1

# App launcher icon — "Sand & Ink" mark. Sources live in icon/ (SVG masters
# plus the rendered 1024px PNGs this tool consumes).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "icon/app_icon.png"
  android: true
  adaptive_icon_background: "#1D1B17"
  adaptive_icon_foreground: "icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "icon/app_icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1D1B17"
    theme_color: "#1D1B17"

flutter:
  uses-material-design: true

  # Optional drop-in vehicle imagery. Both folders are empty apart from their
  # README: cars render offline as vector artwork (lib/core/widgets/
  # car_artwork.dart) until real photos are licensed and registered in
  # lib/core/media/vehicle_assets.dart.
  assets:
    - assets/cars/
    - assets/logos/
